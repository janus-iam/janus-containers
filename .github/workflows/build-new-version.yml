name: B&P Keycloak extended for new version

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read Keycloak version from Containerfile
        id: keycloak
        run: |
          version=$(grep -E '^ARG KEYCLOAK_VERSION=' Containerfile | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          push: true
          file: Containerfile
          context: .
          build-args: |
            KEYCLOAK_VERSION=${{ steps.keycloak.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/keycloak_extended_a:${{ steps.keycloak.outputs.version }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Record image digest
        run: |
          repo="${{ secrets.DOCKERHUB_USERNAME }}/keycloak_extended_a"
          tag="${{ steps.keycloak.outputs.version }}"
          digest="${{ steps.push.outputs.digest }}"
          {
            echo "## Published image"
            echo ""
            echo "- Tag: \`${repo}:${tag}\`"
            echo "- Digest: \`${repo}@${digest}\`"
            echo ""
            echo "Pin deploys with the digest, not only the tag. See \`docs/transparency.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${repo}:${tag} -> ${digest}"
