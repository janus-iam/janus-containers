name: B&P Keycloak extended for fixed versions

on:
    workflow_dispatch:
    push:
      paths:
          - .github/workflows/build-on-demand.yml

jobs:
    build-and-push:
        runs-on: ubuntu-24.04-arm
        strategy:
            fail-fast: false
            matrix:
                keycloak_version:
                    - "26.7.1"
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - uses: docker/build-push-action@v7
              id: push
              with:
                  push: true
                  file: Containerfile
                  context: .
                  build-args: |
                      KEYCLOAK_VERSION=${{ matrix.keycloak_version }}
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/keycloak_extended_a:${{ matrix.keycloak_version }}
                  platforms: linux/amd64,linux/arm64
                  provenance: mode=max
                  sbom: true

            - name: Record image digest
              run: |
                  repo="${{ secrets.DOCKERHUB_USERNAME }}/keycloak_extended_a"
                  tag="${{ matrix.keycloak_version }}"
                  digest="${{ steps.push.outputs.digest }}"
                  {
                    echo "## Published image (${tag})"
                    echo ""
                    echo "- Tag: \`${repo}:${tag}\`"
                    echo "- Digest: \`${repo}@${digest}\`"
                    echo ""
                    echo "Pin deploys with the digest, not only the tag. See \`docs/transparency.md\`."
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "Pushed ${repo}:${tag} -> ${digest}"
