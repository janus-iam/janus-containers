name: B&P Keycloak extended for fixed versions

on:
    workflow_dispatch:
    push:
      paths:
          - .github/workflows/build-on-demand.yml

jobs:
    build-and-push:
        runs-on: ubuntu-24.04-arm
        strategy:
            fail-fast: false
            matrix:
                keycloak_version:
                    - "26.7.1"
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - uses: docker/build-push-action@v7
              with:
                  push: true
                  file: Containerfile
                  context: .
                  build-args: |
                      KEYCLOAK_VERSION=${{ matrix.keycloak_version }}
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/keycloak_extended_a:${{ matrix.keycloak_version }}
                  platforms: linux/amd64,linux/arm64
