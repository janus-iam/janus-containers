# Full Pod/Deployment read for invited auditors who accept spec leakage.
# Kubernetes cannot restrict this to imageID. For digest-only access use
# ../k8s-digest-publisher (ConfigMap running-image-digests).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-pod-reader
  namespace: janus-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-pod-reader
  namespace: janus-auth
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-pod-reader
  namespace: janus-auth
subjects:
  - kind: ServiceAccount
    name: image-pod-reader
    namespace: janus-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-pod-reader
